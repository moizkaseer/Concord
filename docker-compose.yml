services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concord-dev}
      POSTGRES_DB: concord
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Trace viewer. UI on http://localhost:16686, OTLP/HTTP ingest on 4318.
  jaeger:
    image: jaegertracing/jaeger:2.1.0
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  pgdata:
