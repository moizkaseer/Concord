[project]
name = "concord"
version = "0.1.0"
description = "A reliability layer for multi-agent runs: shared blackboard, scheduler and a supervisor that catches stalls, repeated work and task drift."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pydantic>=2",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
